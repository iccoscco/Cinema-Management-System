{% extends 'base.html' %}
{% block title %}Comprar entradas — {{ pelicula.titulo }}{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="max-width:500px">
    <div class="auth-title">🎟 Comprar entradas</div>
    <div class="auth-sub">{{ pelicula.titulo }}</div>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="form-group">
        <label class="form-label">{{ field.label }}</label>
        {% if field.field.widget.input_type == 'select' or field.as_widget|truncatechars:10 == '<select na' %}
          {{ field }}
        {% else %}
          <input type="{{ field.field.widget.input_type }}"
                 name="{{ field.html_name }}"
                 class="form-control"
                 min="{{ field.field.min_value|default:'' }}"
                 max="{{ field.field.max_value|default:'' }}"
                 placeholder="{{ field.field.widget.attrs.placeholder|default:'' }}">
        {% endif %}
        {% if field.errors %}<div class="form-error">{{ field.errors|join:", " }}</div>{% endif %}
      </div>
      {% endfor %}
      {% if form.non_field_errors %}<div class="form-error">{{ form.non_field_errors|join:", " }}</div>{% endif %}
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem">Confirmar compra</button>
      <a href="{% url 'detalle' pelicula.pk %}" class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:.5rem">Cancelar</a>
    </form>
  </div>
</div>
<style>
  .auth-card select { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:10px; padding:.65rem .9rem; color:var(--text); font-size:.9rem; font-family:'Inter',sans-serif; outline:none; }
  .auth-card select:focus { border-color:var(--neon); box-shadow:0 0 0 3px rgba(176,38,255,.15); }
</style>
{% endblock %}
